name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (offline, no network, no model)
        run: python -m unittest discover -s tests -v
      - name: offline demo on every recorded fixture, fail on any unverified quote
        run: |
          for f in fixtures/*.json; do
            python -m review_miner.cli analyze "$f" --backend offline --out "out/$(basename "$f" .json)" --strict
          done
      - name: demo in replay mode (no key), must reproduce the committed example reports
        run: |
          python -m review_miner demo --mode replay --strict --out out/demo
          python - <<'PY'
          import json, pathlib
          for ex in pathlib.Path("examples").glob("*/report.json"):
              a = json.loads(ex.read_text()); b = json.loads((pathlib.Path("out/demo") / ex.parent.name / "report.json").read_text())
              norm = lambda ts: [dict(t, review_ids=sorted(t["review_ids"])) for t in ts]
              assert norm(a["themes"]) == norm(b["themes"]) and a["categories"] == b["categories"], ex
              print("replay matches", ex.parent.name)
          PY
