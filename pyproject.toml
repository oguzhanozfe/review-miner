[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-miner"
version = "0.1.0"
description = "Steam reviews to product themes, with every quote verified against its source review"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
review-miner = "review_miner.cli:main"

[tool.setuptools]
packages = ["review_miner"]
